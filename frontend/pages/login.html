<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PUC Commerce</title>
    <link rel="stylesheet" href="/frontend/assets/css/login.css">
    <link rel="stylesheet" href="/frontend/assets/css/style.css">
</head>
<body>
<div id="screen-login" class="screen active">
  <div class="login-wrap">
    <div class="login-logo">Puc<span>Commerce</span></div>
        <p class="login-tagline">Seu marketplace favorito</p>
        <div class="login-card">
            <div class="tab-switcher">
                <button class="tab-btn active" onclick="switchTab('login')">Entrar</button>
                <button class="tab-btn" onclick="switchTab('register')">Cadastrar</button>
            </div>
        
            <!-- Login Form -->
            <div id="form-login">
                <div class="form-group">
                <label class="form-label">E-mail</label>
                <input class="form-input" type="email" placeholder="seu@email.com" id="login-email">
                </div>
                <div class="form-group">
                <label class="form-label">Senha <a href="#" class="forgot-link" onclick="showForgot(event)">Esqueci a senha</a></label>
                <input class="form-input" type="password" placeholder="••••••••" id="login-pass">
                </div>
                <button class="btn btn-primary btn-full" onclick="doLogin()">Entrar na conta</button>
            </div>
        
            <!-- Register Form -->
            <div id="form-register" style="display:none">
                <div class="form-row">
                <div class="form-group">
                    <label class="form-label">Nome</label>
                    <input class="form-input" placeholder="João" id="reg-name">
                </div>
                <div class="form-group">
                    <label class="form-label">Sobrenome</label>
                    <input class="form-input" placeholder="Silva" id="reg-surname">
                </div>
                </div>
                <div class="form-group">
                <label class="form-label">E-mail</label>
                <input class="form-input" type="email" placeholder="seu@email.com" id="reg-email">
                </div>
                <div class="form-group">
                <label class="form-label">Telefone (opcional)</label>
                <input class="form-input" placeholder="(11) 99999-9999" id="reg-phone">
                </div>
                <div class="form-group">
                <label class="form-label">Senha</label>
                <input class="form-input" type="password" placeholder="Mínimo 8 caracteres" id="reg-pass">
            </div>
            <button class="btn btn-accent btn-full" onclick="doRegister()">Criar conta</button>
        </div>
    </div>
  </div>
</div>

<div id="modal-forgot" class="modal-overlay">
    <div class="modal">
        <div class="modal-header">
            <h2 class="modal-title">Recuperar senha</h2>
            <button class="close-btn" type="button" onclick="closeModal('modal-forgot')">×</button>
        </div>
        <div class="modal-body">
            <div class="form-group">
                <label class="form-label">E-mail cadastrado</label>
                <input class="form-input" type="email" placeholder="seu@email.com" id="forgot-email">
            </div>
            <button class="btn btn-primary btn-full" type="button" onclick="sendForgot()">Gerar código</button>

            <div id="reset-area" class="reset-area">
                <div class="reset-code-box">
                    Código gerado: <strong id="reset-token-preview"></strong>
                </div>
                <div class="form-group">
                    <label class="form-label">Código recebido</label>
                    <input class="form-input" placeholder="ABC123" id="reset-token">
                </div>
                <div class="form-group">
                    <label class="form-label">Nova senha</label>
                    <input class="form-input" type="password" placeholder="Mínimo 8 caracteres" id="reset-pass">
                </div>
                <button class="btn btn-accent btn-full" type="button" onclick="resetPassword()">Alterar senha</button>
            </div>
        </div>
    </div>
</div>

<div id="toast" class="toast"></div>
<script src="/frontend/assets/js/login.js"></script>
</body>
</html>
